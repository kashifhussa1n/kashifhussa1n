name: Refresh profile artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_profile.py"
      - ".github/workflows/refresh-profile.yml"
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render live contribution artwork
        run: python scripts/refresh_profile.py
      - name: Commit refreshed SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile artwork [skip ci]"
          git push

name: Refresh minimal profile

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate contribution data
        run: python scripts/fetch_contributions.py
      - name: Render and validate minimal profile
        run: python scripts/render_profile.py
      - name: Publish fresh profile artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh minimal profile [skip ci]"
          fi
          python scripts/pin_readme_art.py
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin updated profile artwork [skip ci]"
          fi
          git push


name: Refresh contribution skyline

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: contribution-skyline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch verified calendar and render skyline
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_skyline.py
      - name: Publish fresh animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contribution-skyline.svg contribution-skyline-static.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution skyline [skip ci]"
          fi
          python scripts/pin_readme_art.py
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin latest skyline [skip ci]"
          fi
          git push


name: Refresh profile artwork

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_PROFILE_USER: kashifhussa1n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, render and verify real contribution artwork
        run: python scripts/refresh_profile.py
      - name: Commit verified calendar and panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh real profile artwork [skip ci]"
          fi
          python scripts/pin_readme_art.py
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin fresh contribution images [skip ci]"
          fi
          git push

name: Build ASCII cinema

"on":
  workflow_dispatch:
  push:
    branches: [ascii-cinema-preview]
    paths:
      - scripts/render_scenes.py
      - scripts/prepare_scene_assets.py
      - scripts/requirements-scenes.txt
      - .github/workflows/build-ascii-cinema.yml

permissions:
  contents: write

concurrency:
  group: ascii-cinema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-scenes.txt
      - name: Install pinned rendering dependencies
        run: pip install -r scripts/requirements-scenes.txt
      - name: Verify typeface and render all scenes
        run: |
          python scripts/prepare_scene_assets.py
          python scripts/render_scenes.py --stills
          python scripts/render_scenes.py
          python scripts/check_animation.py
      - name: Commit verified animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascii-cinema.webp assets/animation-manifest.json assets/cinema-poster.png assets/scene-contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git commit -m "art: render 25 FPS ASCII cinema [skip ci]"
            git push
          fi
